name: Weekly CVE enrichment

on:
  schedule:
    - cron: "0 4 * * 0"   # Sundays ~midnight US Eastern
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backfill vendor and patch details
        run: python3 scripts/enrich.py
      - name: Commit enriched data
        run: |
          git config user.name "everyday-cve-bot"
          git config user.email "everyday-cve-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Weekly CVE enrichment $(date -u +%F)"
          git push
